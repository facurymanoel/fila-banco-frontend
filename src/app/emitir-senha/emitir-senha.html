<div class="container">

    <div class="card">

        <h1>Emitir Senha</h1>

        <p>
            Escolha o tipo de atendimento
        </p>

        <div class="botoes">

            <button class="normal" 
                    (click)="emitirSenha('NORMAL')">

                Normal
            </button>

            <button class="preferencial" 
                    (click)="emitirSenha('PREFERENCIAL')">

                Preferencial
            </button>

        </div>
        <div class="resultado">

            <h2>Sua senha</h2>

            <div class="senha">

                {{ senhaDto.codigo }}

            </div>

            <p class="data">

                {{ senhaDto.dataCriacao }}

            </p>

        </div>
     </div>
</div>
