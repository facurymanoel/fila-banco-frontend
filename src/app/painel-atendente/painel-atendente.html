<div class="container">

    <div class="card">

        <h1>Painel do Atendente</h1>

        @if (mensagemErro) {
        <p class="erro">
            {{ mensagemErro }}
        </p>
        }

        <div class="senha-atual">

            <h2>Senha Atual</h2>

            <p class="codigo">
                {{ proximaSenhaDto.codigo }}
            </p>

            <p class="status">
                {{ proximaSenhaDto.status }}
            </p>



        </div>

        <div class="botoes">

            <button class="chamar" (click)="chamarProximaSenha()">
                Chamar Próxima Senha
            </button>

            <button class="finalizar" (click)="finalizarSenha()">
                Finalizar Atendimento
            </button>

            <button class="chamar" (click)="abrirPainelEletronico()">
                  Exibir Painel Eletrônico
            </button>

        </div>

    </div>


</div>
